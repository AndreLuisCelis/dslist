spring.application.name=dslist
spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false

# Angular Frontend Configuration
spring.webmvc.cors.allow-credentials=true
# CORS origins are configured in WebConfig.java
# Dev: localhost:4200 (Angular ng serve), localhost:5173 (Vite), localhost:3000 (Docker)
# Production: Update WebConfig.allowedOrigins to production Angular domain

# API Context Path (optional but recommended for clarity)
# Uncomment to enable /api prefix for all endpoints
# server.servlet.context-path=/api


