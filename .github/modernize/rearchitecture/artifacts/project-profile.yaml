    1. Restructuring backend into /backend subdirectory (preserving existing Maven project)
    2. Creating new Angular 18+ application under /frontend
    3. Adding monorepo-level configuration (pom.xml at root, package.json for scripts)
    4. Configuring CORS in backend to support frontend development
    5. Setting up proxy configuration for local development
    6. Documenting structure and runbook
